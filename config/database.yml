default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "12345" } %>

development:
  <<: *default
  database: library_management_development

test:
  <<: *default
  database: library_management_test

production:
  <<: *default
  database: library_management_production
  username: library_management
  password: <%= ENV["LIBRARY_MANAGEMENT_DATABASE_PASSWORD"] %>
